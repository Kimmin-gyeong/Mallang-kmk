<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>말랑말랑</title>
</head>
<body>
<h2>말랑말랑 테스트</h2>

<form action="/chat/correct" method="post">
    <input type="text" name="originalMsg" placeholder="메시지 입력" required>
    <button type="submit">보정 요청하기</button>
</form>

<hr>

<div th:if="${result}">
    <h3>보정 결과</h3>
    <p><strong>원문 메세지:</strong> <span th:text="${result.originalMsg}"></span></p>
    <p><strong>보정 요청 메세지:</strong> <span th:text="${result.finalMsgMsg}"></span></p>
    <p th:if="${result.explanation}">
        <strong>보정 이유:</strong> <span th:text="${result.explanation}"></span>
    </p>
</div>
</body>
</html>
