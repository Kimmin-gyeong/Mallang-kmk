<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>해시태그 조합하기</title>
</head>
<body>
<div>
    <h3>역할 - ROLE</h3>
    <ul>
        <li th:each="tag : ${hashtags}"
            th:if="${#strings.equals(tag.category, 'ROLE')}"
            th:text="${tag.hashtagName}">
        </li>
    </ul>
    <h3>시간 - TIME</h3>
    <ul>
        <li th:each="tag : ${hashtags}"
            th:if="${#strings.equals(tag.category, 'TIME')}"
            th:text="${tag.hashtagName}">
        </li>
    </ul>
</div>


</body>
</html>
